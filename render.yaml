services:
  - type: web
    name: pramaanx-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@latest && pnpm approve-builds --all || true; pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
